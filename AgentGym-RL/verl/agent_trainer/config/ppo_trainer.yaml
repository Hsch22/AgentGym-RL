data:
  tokenizer: null
  train_file: ~/data/rlhf/gsm8k/train.parquet
  val_files: ~/data/rlhf/gsm8k/test.parquet
  prompt_key: item_id
  max_prompt_length: 2048 # Maximum length of the general task description prompt in the first turn.
  max_response_length: 2048 # Maximum total token length of the interaction trajectory (excluding the task prompt).
  train_batch_size: 1024
  val_batch_size: null
  return_raw_input_ids: False  # This should be set to true when the tokenizer between policy and rm differs
  return_raw_chat: True
  shuffle: True
  seed: 1

actor_rollout_ref:
  hybrid_engine: True
  model:
    path: /mnt/workspace/users/mws/husicheng/code/AgentGym-RL/models/Qwen2.5-3B-Instruct
    external_lib: null
    override_config: { }
    enable_gradient_checkpointing: True
    use_remove_padding: False
  actor:
    strategy: fsdp  # This is for backward-compatibility
    ppo_mini_batch_size: 256
    ppo_micro_batch_size: null # will be deprecated, use ppo_micro_batch_size_per_gpu
    ppo_micro_batch_size_per_gpu: null
    use_dynamic_bsz: False
    ppo_max_token_len_per_gpu: 16384 # n * ${data.max_prompt_length} + ${data.max_response_length}
    grad_clip: 1.0
    clip_ratio: 0.2
    entropy_coeff: 0.001
    use_kl_loss: False # True for GRPO
    kl_loss_coef: 0.001 # for grpo
    kl_loss_type: low_var_kl # for grpo
    ppo_epochs: 1
    shuffle: False
    ulysses_sequence_parallel_size: 1 # sp size
    optim:
      lr: 1e-6
      lr_warmup_steps_ratio: 0.  # the total steps will be injected during runtime
      min_lr_ratio: null   # only useful for warmup with cosine
      warmup_style: constant  # select from constant/cosine
      total_training_steps: -1  # must be override by program
    fsdp_config:
      wrap_policy:
        # transformer_layer_cls_to_wrap: None
        min_num_params: 0
      param_offload: False
      grad_offload: False
      optimizer_offload: False
      fsdp_size: -1
  ref:
    fsdp_config:
      param_offload: False
      wrap_policy:
        # transformer_layer_cls_to_wrap: None
        min_num_params: 0
    log_prob_micro_batch_size: null # will be deprecated, use log_prob_micro_batch_size_per_gpu
    log_prob_micro_batch_size_per_gpu: 1
    log_prob_use_dynamic_bsz: ${actor_rollout_ref.actor.use_dynamic_bsz}
    log_prob_max_token_len_per_gpu: ${actor_rollout_ref.actor.ppo_max_token_len_per_gpu}
    ulysses_sequence_parallel_size: ${actor_rollout_ref.actor.ulysses_sequence_parallel_size} # sp size
  agentgym:
      task_name: textcraft # Training task name of AgentGym.
      env_addr: 'http://localhost:5000' # URL of the AgentGym environment server.
      max_retries: 10 # Maximum retry times.
      max_rounds: 10 # Maximum token length of a single response per turn.
      timeout: 300 # timeout seconds.
  rollout:
    name: vllm
    temperature: 1.0
    top_k: -1 # 0 for hf rollout, -1 for vllm rollout
    top_p: 1
    seed: 0
    prompt_length: ${data.max_prompt_length}  # not use for opensource
    response_length: ${data.max_response_length}
    # for vllm rollout
    dtype: bfloat16 # should align with FSDP
    gpu_memory_utilization: 0.5
    ignore_eos: False
    enforce_eager: True
    free_cache_engine: True
    load_format: dummy_dtensor
    tensor_model_parallel_size: 2
    max_num_batched_tokens: 8192
    max_model_len: 32768
    max_num_seqs: 1024
    max_tokens: 1024
    log_prob_micro_batch_size: null # will be deprecated, use log_prob_micro_batch_size_per_gpu
    log_prob_micro_batch_size_per_gpu: 1
    log_prob_use_dynamic_bsz: ${actor_rollout_ref.actor.use_dynamic_bsz}
    log_prob_max_token_len_per_gpu: ${actor_rollout_ref.actor.ppo_max_token_len_per_gpu}
    disable_log_stats: True
    enable_chunked_prefill: True # may get higher throughput when set to True. When activated, Please increase max_num_batched_tokens or decrease max_model_len.
    # for hf rollout
    do_sample: True
    # number of responses (i.e. num sample times)
    n: 1 # > 1 for grpo
    send_interval: 1 # # interval when sending request
    rollout_log_dir: null # Directory for storing rollout trajectories.
    clustering:
      enabled: false                  # Toggle clustering-based action selection
      method: gradient                # "gradient", "gradient_multiview", "g2rl_action_gradient", "g2rl_normalized_action_gradient", "quality_unique_action", "semantic", "random_valid", or "random_raw"
      round1_candidates: 16           # Candidates generated in round 0; default is 2x rollout.n=8
      round1_clusters: 8              # Cluster centers kept as parallel trajectories
      later_candidates: 4             # Candidates generated per trajectory if later-round clustering is enabled
      later_clusters: 1               # Clusters per trajectory in later rounds
      later_cluster_every: 0          # Cluster every N later rounds; 0 disables later-round clustering
      later_cluster_start: 1          # First later round index eligible for clustering
      later_cluster_until: -1         # Last eligible later round index; -1 means no explicit cap
      later_cluster_horizon_min: 0.0  # Skip clustering when remaining-horizon ratio is below this value
      gradient_d_proj: 512            # CountSketch projection dim for gradient clustering
      feature_topk: 256               # Top-k softmax approximation for G2RL/gradient_multiview features
      feature_chunk_size: 4           # HF forward chunk size for G2RL/gradient_multiview/quality_unique_action scoring
      gradient_model_path: /mnt/workspace/users/mws/husicheng/code/AgentGym-RL/models/Qwen2.5-3B-Instruct  # Standalone HF model for gradient/semantic clustering
      action_normalizer: textcraft    # Parser/normalizer for normalized-action clustering: textcraft or sciworld
  mclaw:
    tree_rollout:
      root_budget: 256       # Number of candidate actions sampled at root
      n_envs: 16             # Number of parallel branches (environment instances)
      root_clusters: 16      # Number of clusters for root candidate selection
      branch_budget: 16      # Number of candidate actions per branch expansion
      intra_branch_clusters: 4  # Number of clusters for intra-branch selection
      max_rounds: 30         # Maximum number of tree expansion rounds
    clustering:
      method: hidden_state   # Clustering method: hidden_state, logprob, logit_distribution, output_grad
      pca_dim: 128           # PCA dimensionality for clustering
    q_critic:
      hidden_dim: 3584       # Auto-detected from model config if available
      intermediate_dim: 1024 # Q-head MLP intermediate dimension
      lr: 1e-4               # Q-head learning rate
      gamma: 0.99            # TD discount factor
      update_freq: 1         # Q-head update frequency
      grad_clip_norm: 1.0    # Q-head gradient clip norm
      micro_batch_size: 32   # Micro-batch size for Q-critic forward pass
    aux_loss:
      coef: 0.2              # Auxiliary loss coefficient
      use_same_advantage: true  # Use same advantage for auxiliary samples
      weighting: equal_per_selected_cluster  # Weighting strategy for auxiliary samples

critic:
  rollout_n: ${actor_rollout_ref.rollout.n}
  strategy: fsdp # [fsdp, fsdp2]
  optim:
    lr: 1e-5
    lr_warmup_steps_ratio: 0.  # the total steps will be injected during runtime
    min_lr_ratio: null   # only useful for warmup with cosine
    warmup_style: constant  # select from constant/cosine
    total_training_steps: -1  # must be override by program
  model:
    path: /mnt/workspace/users/mws/husicheng/code/AgentGym-RL/models/Qwen2.5-3B-Instruct
    tokenizer_path: ${actor_rollout_ref.model.path}
    override_config: { }
    external_lib: ${actor_rollout_ref.model.external_lib}
    enable_gradient_checkpointing: True
    use_remove_padding: False
    fsdp_config:
      param_offload: False
      grad_offload: False
      optimizer_offload: False
      wrap_policy:
        # transformer_layer_cls_to_wrap: None
        min_num_params: 0
      fsdp_size: -1
  ppo_mini_batch_size: ${actor_rollout_ref.actor.ppo_mini_batch_size}
  ppo_micro_batch_size: null # will be deprecated, use ppo_micro_batch_size_per_gpu
  ppo_micro_batch_size_per_gpu: null
  forward_micro_batch_size: ${critic.ppo_micro_batch_size}
  forward_micro_batch_size_per_gpu: ${critic.ppo_micro_batch_size_per_gpu}
  use_dynamic_bsz: ${actor_rollout_ref.actor.use_dynamic_bsz}
  ppo_max_token_len_per_gpu: 32768 # (${actor_rollout_ref.actor.ppo_max_token_len_per_gpu}) * 2
  forward_max_token_len_per_gpu: ${critic.ppo_max_token_len_per_gpu}
  ulysses_sequence_parallel_size: 1 # sp size
  ppo_epochs: ${actor_rollout_ref.actor.ppo_epochs}
  shuffle: ${actor_rollout_ref.actor.shuffle}
  grad_clip: 1.0
  cliprange_value: 0.5

reward_model:
  enable: False
  strategy: fsdp
  model:
    input_tokenizer: ${actor_rollout_ref.model.path}  # set this to null if the chat template is identical
    path: ~/models/FsfairX-LLaMA3-RM-v0.1
    external_lib: ${actor_rollout_ref.model.external_lib}
    use_remove_padding: False
    fsdp_config:
      min_num_params: 0
      param_offload: False
      fsdp_size: -1
  micro_batch_size: null # will be deprecated, use micro_batch_size_per_gpu
  micro_batch_size_per_gpu: null # set a number
  max_length: null
  ulysses_sequence_parallel_size: 1 # sp size
  use_dynamic_bsz: ${critic.use_dynamic_bsz}
  forward_max_token_len_per_gpu: ${critic.forward_max_token_len_per_gpu}
  reward_manager: null
  launch_reward_fn_async: False # custom reward function executed async on CPU, during log_prob
  sandbox_fusion:
    url: null # faas url to run code in cloud sandbox
    max_concurrent: 64 # max concurrent requests to sandbox
custom_reward_function:
  path: null
  name: null

algorithm:
  gamma: 1.0
  lam: 1.0
  adv_estimator: gae
  kl_penalty: kl  # how to estimate kl divergence
  rounds_ctrl:
    type: fixed  # Strategy for controlling the maximum number of interaction turns
    rounds: 15  # Maximum number of allowed interaction turns.
    steps_scaling_inter: 100  # Frequency (in training steps) to increase the maximum number of turns when using `scaling_inter_stepwise`.
  g2rl:
    enabled: false             # Paper-style trajectory-level G2RL reward shaping before advantage computation
    stop_after_steps: null     # null or <=0 keeps G2RL active for the whole run; positive values stop after that global step
    feature_scope: response    # response keeps legacy trajectory-level features; action keeps raw Action contents; normalized_action uses parser-normalized TextCraft action sequences
    lambda_coef: 1.0           # Multiplicative novelty strength: shaped_signed = signed_reward * (1 + lambda * novelty)
    reward_clip: 3.0           # Clip shaped signed reward to [-reward_clip, reward_clip]
    zero_one_to_signed: true   # Map 0/1 task success to -1/+1 before shaping
    normalize_novelty: true    # Min-max normalize novelty within each prompt group
    novelty_dtype: float64     # Precision for driver-side novelty/cosine computation: float32 or float64
    skip_all_failed_groups: false  # When true, leave all-failed prompt groups on original signed rewards
    success_only_novelty: false    # When true, compute/apply novelty only on successful trajectories
    feature_topk: 256          # Top-k softmax approximation for E_p[W]
    token_chunk_size: 256      # Token chunk size for feature accumulation inside actor forward
    eps: 1e-6
  kl_ctrl:
    type: fixed
    kl_coef: 0.001

trainer:
  total_epochs: 30
  total_training_steps: null
  project_name: verl_examples
  experiment_name: gsm8k
  logger: [ 'console', 'wandb' ]
  val_generations_to_log_to_wandb: 0
  nnodes: 1
  n_gpus_per_node: 8
  save_freq: -1
  # disable: start from scratch; auto: use default_local_dir/latest_checkpointed_iteration.txt;
  # /path/to/global_step_N: explicitly resume that checkpoint.
  resume_mode: auto
  resume_allow_extend_total_training_steps: false  # Allow continuing a strict checkpoint with a larger total_training_steps.
  resume_from_path: False
  test_freq: -1
  test_batches: 1
  early_stop:
    enabled: false
    metric: eval/task_score/mean
    mode: max
    min_steps: 0
    patience: 0
    min_delta: 0.0
    max_drop: null
    hard_min_metric: null
    min_rollout_valid_ratio: null
    max_response_length_mean: null
    max_kl_loss: null
    max_grad_norm: null
    save_on_stop: true
  critic_warmup: 0
  default_hdfs_dir: null
  remove_previous_ckpt_in_save: False
  del_local_ckpt_after_load: False
  default_local_dir: checkpoints/${trainer.project_name}/${trainer.experiment_name}
  storage_mode: local
